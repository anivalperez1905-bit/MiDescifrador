name: Build APK Fenix
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git python3-dev python3-pip openjdk-17-jdk \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev zlib1g-dev unzip wget

      - name: Instalar Buildozer
        run: |
          python3 -m pip install --user --upgrade pip setuptools wheel
          python3 -m pip install --user "cython<3.0"
          python3 -m pip install --user buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Preparar SDK y aceptar licencias
        run: |
          mkdir -p ~/.buildozer/android/platform
          cd ~/.buildozer/android/platform
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          export ANDROID_HOME=$HOME/.buildozer/android/platform
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-33" "build-tools;34.0.0" "platform-tools"

      - name: Compilar APK
        run: |
          export ANDROID_HOME=$HOME/.buildozer/android/platform
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          buildozer android debug
        timeout-minutes: 60

      - name: Subir APK ✅
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FenixDecryptor-APK
          path: bin/*.apk
