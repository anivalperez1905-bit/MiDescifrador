name: Build APK Fenix
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar dependencias
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git python3-dev python3-pip \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev zlib1g-dev

      - name: Instalar Buildozer
        run: |
          python3 -m pip install --user --upgrade pip setuptools wheel
          python3 -m pip install --user "cython<3.0"
          python3 -m pip install --user buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Compilar APK
        run: buildozer android debug
        timeout-minutes: 60

      - name: Subir APK ✅
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FenixDecryptor-APK
          path: bin/*.apk
