name: Build APK Fenix
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git python3-dev python3-pip openjdk-17-jdk \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev zlib1g-dev

      - name: Instalar Buildozer
        run: |
          python3 -m pip install --user --upgrade pip setuptools wheel
          python3 -m pip install --user "cython<3.0"
          python3 -m pip install --user buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Aceptar licencias de Android
        run: |
          mkdir -p ~/.android
          echo "24333f8a63b6825ea9c5514f83c2829b004f1a4b" > ~/.android/repository-1.cfg
          echo "d9712f16100b41208d658e3e270c896034e46b57" >> ~/.android/repository-1.cfg

      - name: Compilar APK
        run: buildozer android debug
        timeout-minutes: 45

      - name: Subir APK ✅
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FenixDecryptor-APK
          path: bin/*.apk
