name: Build APK Fenix
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar paquetes del sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git python3-dev python3-pip unzip wget \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev zlib1g-dev

      - name: Instalar Buildozer
        run: |
          python3 -m pip install --user --upgrade pip setuptools wheel
          python3 -m pip install --user "cython<3.0"
          python3 -m pip install --user buildozer==1.5.0
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Descargar e instalar Android SDK Tools
        run: |
          mkdir -p ~/.buildozer/android/platform
          cd ~/.buildozer/android/platform
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip
          mkdir -p android-sdk/cmdline-tools
          mv cmdline-tools android-sdk/cmdline-tools/latest
          mkdir -p android-sdk/platform-tools

      - name: Crear licencias aceptadas ✅
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004f1a4b" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d9712f16100b41208d658e3e270c896034e46b57" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      - name: Configurar rutas y compilar
        run: |
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          buildozer android debug
        timeout-minutes: 60

      - name: Subir APK ✅
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FenixDecryptor-APK
          path: bin/*.apk
